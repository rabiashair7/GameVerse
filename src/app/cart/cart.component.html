<div class="cart-page">

  <h2>🛒 Your Cart</h2>

  <!-- Not logged in -->
  <div class="cart-empty" *ngIf="!isLoggedIn">
    <p>You must login to see your cart.</p>
    <button (click)="goLogin()">Go to Login</button>
  </div>

  <!-- Logged in -->
  <ng-container *ngIf="isLoggedIn">

    <!-- Empty cart -->
    <div class="cart-empty" *ngIf="cartItems.length === 0">
      <p>Your cart is empty.</p>
      <button (click)="goHome()">Browse Games</button>
    </div>

    <!-- Cart items -->
    <div *ngIf="cartItems.length > 0" class="cart-list">

      <div class="cart-item" *ngFor="let item of cartItems">
        <img class="thumb" [src]="item.image" alt="Game image" />

        <div class="details">
          <h4 class="title">{{ item.title }}</h4>
          <p class="price">${{ item.price | number:'1.2-2' }}</p>
        </div>

        <div class="qty">
          <button (click)="decrease(item.gameId)">−</button>
          <span>{{ item.qty }}</span>
          <button (click)="increase(item.gameId)">+</button>
        </div>

        <div class="subtotal">
          ${{ (item.price * item.qty) | number:'1.2-2' }}
        </div>

        <button class="remove" (click)="remove(item.gameId)">
          Remove
        </button>
      </div>

      <div class="cart-footer">
        <div class="total">
          <strong>Total:</strong> ${{ total | number:'1.2-2' }}
        </div>

        <div class="actions">
          <button class="clear" (click)="clearCart()">Clear Cart</button>
          <button class="checkout" (click)="checkout()">Checkout</button>
        </div>
      </div>

    </div>
  </ng-container>

</div>
