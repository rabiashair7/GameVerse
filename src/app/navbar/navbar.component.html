<nav class="store-navbar">

  <!-- LEFT SIDE -->
  <div class="categories">

    <!-- CATEGORIES DROPDOWN -->
    <button
      class="categories-btn"
      (click)="toggleDropdown()"
      type="button">
      Categories ▾
    </button>

    <!-- ✅ CATALOG LINK -->
    <a
      routerLink="/catalog"
      class="catalog-link">
      Catalog
    </a>

    <!-- DROPDOWN -->
    <div class="dropdown" *ngIf="isOpen">
      <div class="grid">
        <a routerLink="/category/action" (click)="closeDropdown()">Action</a>
        <a routerLink="/category/adventure" (click)="closeDropdown()">Adventure</a>
        <a routerLink="/category/sports" (click)="closeDropdown()">Sports</a>
        <a routerLink="/category/rpg" (click)="closeDropdown()">RPG</a>
        <a routerLink="/category/racing" (click)="closeDropdown()">Racing</a>
        <a routerLink="/category/strategy" (click)="closeDropdown()">Strategy</a>
        <a routerLink="/category/open-world" (click)="closeDropdown()">Open World</a>
      </div>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="icons">
    <a routerLink="/wishlist">❤️</a>
    <a routerLink="/cart">🛒</a>
  </div>

</nav>
