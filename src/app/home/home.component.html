<!-- 🔥 POPULAR GAMES -->
<section *ngIf="popularGames.length">
  <h2>🔥 Most Popular Games</h2>

  <div class="grid">
    <div class="game-card" *ngFor="let g of popularGames">
      <img [src]="g.coverImage">
      <h4>{{ g.title }}</h4>
      <p>{{ g.unitsSold | number }} sold</p>
    </div>
  </div>
</section>

<!-- 🔍 SEARCH & SORT -->
<div class="search-sort">
  <input
    placeholder="Search games..."
    [(ngModel)]="search"
    (input)="applySearchAndSort()">

  <select [(ngModel)]="sortBy" (change)="applySearchAndSort()">
    <option value="title">Title</option>
    <option value="price">Price</option>
    <option value="date">Release Date</option>
  </select>
</div>

<!-- 🎮 ALL GAMES -->
<div class="grid">
  <div class="game-card" *ngFor="let g of games">
    <img [src]="g.coverImage">
    <h4>{{ g.title }}</h4>
    <p>${{ g.price }}</p>
  </div>
</div>
