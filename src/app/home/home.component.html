<!-- 🔥 POPULAR GAMES -->
<section *ngIf="popularGames.length">
  <h2>🔥 Most Popular Games</h2>

  <div class="grid">
    <div
      class="game-card"
      *ngFor="let g of popularGames"
      [routerLink]="['/game', g.id]"
    >
      <img [src]="g.image" alt="{{ g.title }}">

      <h4>{{ g.title }}</h4>

      <p class="developer">{{ g.developer }}</p>

      <p>{{ g.unitsSold }} sold</p>
    </div>
  </div>
</section>

<!-- 🔍 SEARCH & SORT -->
<div class="search-sort">
  <input
    type="text"
    placeholder="Search by title or developer..."
    [(ngModel)]="search"
    (input)="applySearchAndSort()"
  >

  <select [(ngModel)]="sortBy" (change)="applySearchAndSort()">
    <option value="title">Title</option>
    <option value="price">Price</option>
    <option value="date">Release Date</option>
  </select>
</div>

<!-- 🎮 ALL GAMES -->
<div class="grid">
  <div
    class="game-card"
    *ngFor="let g of filteredGames"
    [routerLink]="['/game', g.id]"
  >
    <img [src]="g.image" alt="{{ g.title }}">

    <h4>{{ g.title }}</h4>

    <p class="developer">{{ g.developer }}</p>

    <p class="price">${{ g.price }}</p>

    <span *ngIf="g.popular" class="popular-badge">🔥 Popular</span>
  </div>
</div>
