<div *ngIf="loading" class="loading">
  Loading game...
</div>

<div *ngIf="!loading && error" class="error">
  {{ error }}
</div>

<div *ngIf="!loading && game" class="game-card-page">

  <button class="back-btn" (click)="goHome()">
    ⬅ Back to Home
  </button>

  <h1>{{ game.title }}</h1>
  <p class="developer">{{ game.developer }}</p>

  <div class="image-viewer">
    <img [src]="selectedImage" class="main-image">
  </div>

  <div class="thumbnails" *ngIf="allImages.length">
    <img
      *ngFor="let img of allImages"
      [src]="img"
      (click)="selectImage(img)"
      [class.active]="img === selectedImage"
    >
  </div>

  <div class="info">
    <p class="price">${{ game.price }}</p>
    <p class="release">Released: {{ game.releaseDate }}</p>
    <p class="description">{{ game.details }}</p>

    <button
      class="cart-btn"
      (click)="addToCart()"
      [disabled]="isInCart()"
    >
      {{ isInCart() ? 'In Cart' : 'Add to Cart' }}
    </button>

    <button
      class="wishlist-btn"
      (click)="addToWishlist()"
      [disabled]="isInWishlist()"
    >
      {{ isInWishlist() ? 'In Wishlist' : 'Add to Wishlist' }}
    </button>
  </div>

  <div *ngIf="safeVideos.length" class="videos">
    <iframe
      *ngFor="let v of safeVideos"
      [src]="v"
      frameborder="0"
      allowfullscreen
    ></iframe>
  </div>

</div>
