<div class="user-details-card" *ngIf="user">

  <!-- =============================
       AVATAR
       ============================= -->
  <div class="avatar">
    <img [src]="avatarSrc" alt="User Avatar">

    <!-- 📷 CHANGE IMAGE -->
    <label class="upload-btn">
      Change photo
      <input
        type="file"
        accept="image/*"
        (change)="onImageUpload($event)"
        hidden
      >
    </label>
  </div>

  <!-- =============================
       INFO
       ============================= -->
  <div class="info">

    <h3>User Details</h3>

    <!-- SUCCESS / ERROR -->
    <div class="success" *ngIf="success">{{ success }}</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <!-- =============================
         READ MODE
         ============================= -->
    <div *ngIf="!editMode && !passwordMode">

      <p><strong>Name:</strong> {{ user.fullName }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Gender:</strong> {{ user.gender }}</p>
      <p>
        <strong>Date of Birth:</strong>
        {{ user.dob | date:'dd/MM/yyyy' }}
      </p>
      <p><strong>Role:</strong> {{ user.role }}</p>
      <p>
        <strong>Joined:</strong>
        {{ user.createdAt | date:'dd/MM/yyyy' }}
      </p>

      <div class="actions">
        <button
          (click)="editMode = true; passwordMode = false"
        >
          Edit Profile
        </button>

        <button
          (click)="passwordMode = true; editMode = false"
        >
          Change Password
        </button>
      </div>

    </div>

    <!-- =============================
         EDIT PROFILE
         ============================= -->
    <div *ngIf="editMode">

      <label>Full Name</label>
      <input
        type="text"
        [(ngModel)]="user.fullName"
      >

      <label>Gender</label>
      <select [(ngModel)]="user.gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label>Date of Birth</label>
      <input
        type="date"
        [(ngModel)]="user.dob"
      >

      <div class="actions">
        <button
          (click)="saveProfile()"
          [disabled]="!user.fullName || !user.gender || !user.dob"
        >
          Save
        </button>

        <button
          class="secondary"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>

    </div>

    <!-- =============================
         CHANGE PASSWORD
         ============================= -->
    <div *ngIf="passwordMode">

      <label>Current Password</label>
      <input
        type="password"
        [(ngModel)]="currentPassword"
      >

      <label>New Password</label>
      <input
        type="password"
        [(ngModel)]="newPassword"
      >

      <div class="actions">
        <button
          (click)="changePassword()"
          [disabled]="!currentPassword || !newPassword"
        >
          Update Password
        </button>

        <button
          class="secondary"
          (click)="cancelPassword()"
        >
          Cancel
        </button>
      </div>

    </div>

  </div>
</div>
