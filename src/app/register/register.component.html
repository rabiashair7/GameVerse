<div class="container mt-5">
  <div class="card p-4 shadow mx-auto" style="max-width: 460px;">

    <h3 class="text-center mb-4">Create Account</h3>

    <!-- ================= REGISTER FORM ================= -->
    <form
      [formGroup]="registerForm"
      (ngSubmit)="submitRegister()"
    >

      <!-- NAME -->
      <input
        type="text"
        formControlName="name"
        class="form-control mb-2"
        [class.is-invalid]="isInvalid('name')"
        placeholder="Full name"
      >
      <div class="invalid-feedback">
        Name is required (minimum 2 characters)
      </div>

      <!-- DATE OF BIRTH -->
      <input
        type="date"
        formControlName="dob"
        class="form-control mb-2"
        [class.is-invalid]="isInvalid('dob')"
        [max]="today"
      >
      <div class="invalid-feedback">
        Birth date cannot be in the future
      </div>

      <!-- EMAIL -->
      <input
        type="email"
        formControlName="email"
        class="form-control mb-2"
        [class.is-invalid]="isInvalid('email')"
        placeholder="Email address"
      >
      <div class="invalid-feedback">
        Please enter a valid email address
      </div>

      <!-- PASSWORD -->
      <input
        type="password"
        formControlName="password"
        class="form-control mb-1"
        [class.is-invalid]="isInvalid('password')"
        placeholder="Password"
      >

      <small class="text-muted d-block mb-1">
        At least 8 characters, uppercase, lowercase, number & special character
      </small>

      <div class="mb-2">
        Password strength:
        <span
          [class.text-success]="passwordStrong()"
          [class.text-danger]="!passwordStrong()"
        >
          {{ passwordStrong() ? 'Strong' : 'Weak' }}
        </span>
      </div>

      <!-- PHONE -->
      <input
        type="text"
        formControlName="phone"
        class="form-control mb-1"
        [class.is-invalid]="isInvalid('phone')"
        placeholder="Phone number"
      >

      <small class="text-muted">
        Optional – for account recovery
      </small>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-3"
        [disabled]="registerForm.invalid"
      >
        Register
      </button>

    </form>

  </div>
</div>
