<header class="top-navbar">
  <!-- LEFT -->
  <div class="left">
    <!-- Dummy Logo -->
    <span class="logo">
      🎮 GameVerse
    </span>

    <!-- Navigation -->
    <nav class="links">
      <!-- Store (always visible) -->
      <a routerLink="/home" routerLinkActive="active">
        Store
      </a>

      <!-- About Us (always visible) -->
      <a routerLink="/about" routerLinkActive="active">
        About Us
      </a>

      <!-- Library (hidden for admin) -->
      <a
        *ngIf="userService.isLoggedIn() && !userService.getCurrentUser()!.isAdmin()"
        routerLink="/library"
        routerLinkActive="active"
      >
        Library
      </a>

      <!-- Admin (admin only) -->
      <a
        *ngIf="userService.isLoggedIn() && userService.getCurrentUser()!.isAdmin()"
        routerLink="/admin"
        routerLinkActive="active"
      >
        Admin
      </a>
    </nav>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <!-- Theme Toggle -->
    <button class="theme-btn" (click)="toggleTheme()">
      {{ userService.isDarkMode() ? '☀️' : '🌙' }}
    </button>

    <!-- 👤 PROFILE DROPDOWN (user + admin) -->
    <div
      *ngIf="userService.isLoggedIn() && avatarSrc"
      class="navbar-avatar-wrapper"
    >
      <img
        [src]="avatarSrc"
        alt="Profile"
        class="navbar-avatar"
        (click)="toggleDropdown()"
      >

      <!-- 🛡 ADMIN BADGE -->
      <span
        *ngIf="userService.getCurrentUser()?.isAdmin()"
        class="admin-badge"
      >
        ADMIN
      </span>

      <!-- ⬇️ DROPDOWN -->
      <div
        class="profile-dropdown"
        *ngIf="dropdownOpen"
      >
        <button (click)="goToProfile()">
          Profile
        </button>

        <button (click)="logout()">
          Logout
        </button>
      </div>
    </div>

    <!-- Login (guest only) -->
    <a
      *ngIf="!userService.isLoggedIn()"
      routerLink="/login"
      class="login"
    >
      Login
    </a>
  </div>
</header>
