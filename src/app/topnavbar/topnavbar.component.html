<header class="top-navbar"> 
  <!-- LEFT -->
  <div class="left">
    <span class="logo">🎮 GameVerse</span>

    <nav class="links">
      <a routerLink="/home" routerLinkActive="active">Store</a>
      <a routerLink="/about" routerLinkActive="active">About Us</a>

      <!-- Admin only -->
      <a
        *ngIf="userService.isLoggedIn() && userService.getCurrentUser()?.isAdmin()"
        routerLink="/admin"
        routerLinkActive="active"
      >
        Admin
      </a>
    </nav>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <!-- Theme -->
    <button class="theme-btn" (click)="toggleTheme()">
      {{ userService.isDarkMode() ? '☀️' : '🌙' }}
    </button>

    <!-- Profile -->
    <div
      *ngIf="userService.isLoggedIn() && avatarSrc"
      class="navbar-avatar-wrapper"
    >
      <img
        [src]="avatarSrc"
        class="navbar-avatar"
        (click)="toggleDropdown()"
      >

      <span
        *ngIf="userService.getCurrentUser()?.isAdmin()"
        class="admin-badge"
      >
        ADMIN
      </span>

      <div class="profile-dropdown" *ngIf="dropdownOpen">
        <button (click)="goToProfile()">Profile</button>
        <button (click)="logout()">Logout</button>
      </div>
    </div>

    <!-- Login -->
    <a *ngIf="!userService.isLoggedIn()" routerLink="/login" class="login">
      Login
    </a>
  </div>
</header>
