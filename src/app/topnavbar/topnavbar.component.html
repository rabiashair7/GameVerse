<header class="top-navbar">
  <!-- LEFT -->
  <div class="left">
    <!-- Dummy Logo -->
    <span class="logo">
      🎮 GameVerse
    </span>

    <!-- Navigation -->
    <nav class="links">
      <!-- Store (always visible) -->
      <a routerLink="/home" routerLinkActive="active">
        Store
      </a>

      <!-- About Us (always visible) -->
      <a routerLink="/about" routerLinkActive="active">
        About Us
      </a>

      <!-- Library (hidden for admin) -->
      <a
        *ngIf="userService.getCurrentUser() && !userService.getCurrentUser()!.isAdmin()"
        routerLink="/library"
        routerLinkActive="active"
      >
        Library
      </a>

      <!-- Profile (user only) -->
      <a
        *ngIf="userService.isLoggedIn() && !userService.getCurrentUser()!.isAdmin()"
        routerLink="/profile"
        routerLinkActive="active"
      >
        Profile
      </a>

      <!-- Admin (admin only) -->
      <a
        *ngIf="userService.isLoggedIn() && userService.getCurrentUser()!.isAdmin()"
        routerLink="/admin"
        routerLinkActive="active"
      >
        Admin
      </a>
    </nav>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <!-- Theme Toggle -->
    <button class="theme-btn" (click)="toggleTheme()">
      {{ userService.isDarkMode() ? '☀️' : '🌙' }}
    </button>

    <!-- Login (guest only) -->
    <a
      *ngIf="!userService.isLoggedIn()"
      routerLink="/login"
      class="login"
    >
      Login
    </a>

    <!-- Logout (logged in only) -->
    <button
      *ngIf="userService.isLoggedIn()"
      class="logout"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</header>
