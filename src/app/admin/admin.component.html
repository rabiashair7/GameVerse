<div class="admin-container">

  <h2>🎮 GameVerse Admin Panel</h2>

  <div class="admin-card">
    <h4>{{ editingGame ? 'Edit Game' : 'Add New Game' }}</h4>

    <div class="form-grid">
      <input placeholder="Game title" [(ngModel)]="title">
      <input type="number" placeholder="Price" [(ngModel)]="price">
      <input placeholder="Cover Image URL" [(ngModel)]="image">
      <input type="number" placeholder="Units Sold (Worldwide)" [(ngModel)]="unitsSold">
    </div>

    <input type="date" [(ngModel)]="releaseDate">

    <textarea rows="3" placeholder="Game details" [(ngModel)]="details"></textarea>

    <textarea rows="2" placeholder="Images (one per line)" [(ngModel)]="imagesText"></textarea>
    <textarea rows="2" placeholder="Videos (one per line)" [(ngModel)]="videosText"></textarea>

    <div class="categories">
      <span
        *ngFor="let cat of categories"
        class="category"
        [class.active]="selectedCategories.includes(cat)"
        (click)="toggleCategory(cat)">
        {{ cat }}
      </span>
    </div>

    <button (click)="editingGame ? saveEdit() : addGame()">
      {{ editingGame ? 'Save Changes' : 'Add Game' }}
    </button>
  </div>

</div>
