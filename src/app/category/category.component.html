<h2 class="title">{{ category | titlecase }}</h2>

<!-- 🔍 SEARCH + SORT -->
<div class="search-sort">
  <input
    type="text"
    placeholder="Search games..."
    [(ngModel)]="search"
    (input)="applyFilters()"
  >

  <select [(ngModel)]="sortBy" (change)="applyFilters()">
    <option value="title">Title</option>
    <option value="price">Price</option>
  </select>
</div>

<!-- 🎮 CATEGORY GAMES -->
<div class="grid">
  <div
    class="game-card"
    *ngFor="let g of filteredGames"
    [routerLink]="['/game', g.id]"
  >
    <img [src]="g.image" alt="{{ g.title }}">

    <h4>{{ g.title }}</h4>

    <p class="developer">{{ g.developer }}</p>

    <p class="price">${{ g.price }}</p>

    <span *ngIf="g.popular" class="popular-badge">
      🔥 Popular
    </span>
  </div>
</div>

<!-- ❌ EMPTY STATE -->
<p *ngIf="!filteredGames.length" class="empty">
  No games found in this category.
</p>
