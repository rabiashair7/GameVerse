<div class="lib-wrap">
  <h2 class="title">📚 My Library</h2>

  <div *ngIf="loading" class="state">Loading...</div>

  <div *ngIf="!loading && error" class="state error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && libraryGames.length === 0" class="state empty">
    <p>Your library is empty.</p>
    <button routerLink="/catalog">Browse Games</button>
  </div>

  <div class="grid" *ngIf="!loading && !error && libraryGames.length > 0">
    <div class="card" *ngFor="let game of libraryGames">

      <div class="img-wrap" (click)="goToDetails(game.id)">
        <img [src]="game.image" [alt]="game.title" />
      </div>

      <div class="info">
        <div class="name">{{ game.title }}</div>
        <div class="dev">{{ game.developer }}</div>

        <div class="row">
          <div class="price">${{ game.price }}</div>
          <button class="remove" (click)="remove(game.id)">Remove</button>
        </div>
      </div>

    </div>
  </div>
</div>
